name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  checks: write      # Required to publish test reports to PR checks

jobs:
  # Job 1: Build compilation check (Runs first and warms/updates the cache)
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Compile Code (Build)
        run: npm run build

  # Job 2: Static Code Analysis (Lint) - Runs after build finishes
  lint:
    name: Lint Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies (Skip if Cache Hit)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # Job 3: Automated Unit Testing & Reporting - Runs after build finishes
  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies (Skip if Cache Hit)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Web Test Runner
        run: npm run test
        continue-on-error: true # Ensure we still upload reports and publish even if tests fail

      - name: Upload Raw Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Publish Test Report in GitHub UI
        uses: mikepenz/action-junit-report@v4
        if: always() # Always run this step to publish reports
        with:
          report_paths: '**/test-results.xml'
          check_name: 'Unit Test Results Report'
          fail_on_failure: true # Explicitly fail this job step if any tests failed
